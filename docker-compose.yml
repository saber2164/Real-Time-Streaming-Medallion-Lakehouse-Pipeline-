services:
  ###############################################################################
  # Redpanda — Kafka API-compatible broker (C++, no JVM, no ZooKeeper)
  # Dual listeners:
  #   internal  redpanda:9092   -> used by Spark & producer containers
  #   external  localhost:19092 -> used by host-side tools (rpk, console from host)
  ###############################################################################
  redpanda:
    image: redpandadata/redpanda:v24.3.10
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 256M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"   # external Kafka API for host tools
      - "8081:8081"     # Redpanda RPC / admin (not used by app)
    healthcheck:
      test: ["CMD", "rpk", "topic", "list", "--brokers", "redpanda:9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - lakehouse-net
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  ###############################################################################
  # Redpanda Console — web UI for the broker
  ###############################################################################
  console:
    image: redpandadata/console:v2.8.4
    depends_on:
      redpanda:
        condition: service_healthy
    # Image ENTRYPOINT is `./console` (workdir /app); pass only the flags.
    command: ["-config.filepath", "/config/console.yaml"]
    volumes:
      - ./console.yaml:/config/console.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - lakehouse-net

  ###############################################################################
  # Topic initializer — creates the `order-events` topic (3 partitions)
  # Runs once after Redpanda is healthy, then exits.
  ###############################################################################
  topic-init:
    image: redpandadata/redpanda:v24.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    # Idempotent: create the topic, or (if it already exists) verify it exists
    # so the container exits 0 and `spark` can wait on completion.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create order-events --partitions 3 --replicas 1 --brokers redpanda:9092
        || rpk topic describe order-events --brokers redpanda:9092 >/dev/null
    networks:
      - lakehouse-net
    restart: "no"

  ###############################################################################
  # Spark + Delta Lake + Kafka connector
  # Python 3.9 to match host; volumes bind ./lakehouse and ./checkpoints.
  ###############################################################################
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"   # Spark UI
    environment:
      - SPARK_MASTER=local[*]
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - BRONZE_PATH=/lakehouse/bronze/order_events
      - SILVER_PATH=/lakehouse/silver/order_events
      - GOLD_PATH=/lakehouse/gold/hourly_sales
      - CHECKPOINT_BASE=/checkpoints
      - PYTHONUNBUFFERED=1
    volumes:
      - ./lakehouse:/lakehouse
      - ./checkpoints:/checkpoints
      - ./spark:/opt/spark/app
      - ./scripts:/opt/spark/scripts:ro
      - ./tests:/opt/spark/tests:ro
      - ./.ivy2:/root/.ivy2   # cache --packages jars across runs
    networks:
      - lakehouse-net
    tty: true
    stdin_open: true

  ###############################################################################
  # Producer — synthetic order events to Redpanda
  # Optional profile so `docker-compose up -d` does not start it automatically.
  # Run with: docker-compose --profile producer up -d producer
  ###############################################################################
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      - BOOTSTRAP_SERVERS=redpanda:9092
      - TOPIC=order-events
      - RATE=50
      - DUP_RATIO=0.10
      - LATE_RATIO=0.10
      - DURATION=0
      - SEED=42
    volumes:
      - ./producer:/app
    networks:
      - lakehouse-net
    profiles:
      - producer

  ###############################################################################
  # Live Gold refresher — recomputes Gold from Silver every 10 s and writes the
  # dashboard's JSON snapshot. Optional profile: it is not part of the canonical
  # one-shot run (gold_compaction.py remains the end-of-run compaction job).
  #
  #   docker-compose --profile dashboard up -d gold-refresh dashboard
  ###############################################################################
  gold-refresh:
    build:
      context: .
      dockerfile: Dockerfile.spark
    environment:
      - BRONZE_PATH=/lakehouse/bronze/order_events
      - SILVER_PATH=/lakehouse/silver/order_events
      - GOLD_PATH=/lakehouse/gold/hourly_sales
      - QUARANTINE_PATH=/lakehouse/silver/_quarantine
      - DASHBOARD_METRICS_PATH=/lakehouse/dashboard/metrics.json
      - GOLD_REFRESH_SECONDS=10
      - PYTHONUNBUFFERED=1
      - SPARK_UI_PORT=4042
    volumes:
      - ./lakehouse:/lakehouse
      - ./checkpoints:/checkpoints
      - ./spark:/opt/spark/app
      - ./.ivy2:/root/.ivy2
    command:
      - spark-submit
      - --master
      - local[2]
      - --packages
      - io.delta:delta-spark_2.12:3.2.0
      - /opt/spark/app/gold_refresh.py
    networks:
      - lakehouse-net
    profiles:
      - dashboard
    restart: unless-stopped
    stop_grace_period: 60s

  ###############################################################################
  # Stakeholder dashboard — read-only HTTP server for the Gold-layer metrics.
  # No Spark/Delta access: it only serves the JSON written by gold-refresh.
  # Bound to 127.0.0.1 so it is not exposed on the LAN by default.
  ###############################################################################
  dashboard:
    build:
      # Repo-root context: the image ships docs/dashboard.html (the same page
      # GitHub Pages publishes) plus its fonts and stylesheets.
      context: .
      dockerfile: dashboard/Dockerfile
    environment:
      - METRICS_PATH=/lakehouse/dashboard/metrics.json
      - PORT=8501
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./lakehouse:/lakehouse:ro
    networks:
      - lakehouse-net
    profiles:
      - dashboard
    restart: unless-stopped
    init: true

networks:
  lakehouse-net:
    driver: bridge

volumes:
  redpanda-data:
