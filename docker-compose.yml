services:
  ###############################################################################
  # Redpanda — Kafka API-compatible broker (C++, no JVM, no ZooKeeper)
  # Dual listeners:
  #   internal  redpanda:9092   -> used by Spark & producer containers
  #   external  localhost:19092 -> used by host-side tools (rpk, console from host)
  ###############################################################################
  redpanda:
    image: redpandadata/redpanda:v24.3.10
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 256M
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
    ports:
      - "19092:19092"   # external Kafka API for host tools
      - "8081:8081"     # Redpanda RPC / admin (not used by app)
    healthcheck:
      test: ["CMD", "rpk", "topic", "list", "--brokers", "redpanda:9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - lakehouse-net
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  ###############################################################################
  # Redpanda Console — web UI for the broker
  ###############################################################################
  console:
    image: redpandadata/console:v2.8.4
    depends_on:
      redpanda:
        condition: service_healthy
    # Image ENTRYPOINT is `./console` (workdir /app); pass only the flags.
    command: ["-config.filepath", "/config/console.yaml"]
    volumes:
      - ./console.yaml:/config/console.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - lakehouse-net

  ###############################################################################
  # Topic initializer — creates the `order-events` topic (3 partitions)
  # Runs once after Redpanda is healthy, then exits.
  ###############################################################################
  topic-init:
    image: redpandadata/redpanda:v24.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    # Idempotent: create the topic, or (if it already exists) verify it exists
    # so the container exits 0 and `spark` can wait on completion.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rpk topic create order-events --partitions 3 --replicas 1 --brokers redpanda:9092
        || rpk topic describe order-events --brokers redpanda:9092 >/dev/null
    networks:
      - lakehouse-net
    restart: "no"

  ###############################################################################
  # Spark + Delta Lake + Kafka connector
  # Python 3.9 to match host; volumes bind ./lakehouse and ./checkpoints.
  ###############################################################################
  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"   # Spark UI
    environment:
      - SPARK_MASTER=local[*]
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - BRONZE_PATH=/lakehouse/bronze/order_events
      - SILVER_PATH=/lakehouse/silver/order_events
      - GOLD_PATH=/lakehouse/gold/hourly_sales
      - CHECKPOINT_BASE=/checkpoints
      - PYTHONUNBUFFERED=1
    volumes:
      - ./lakehouse:/lakehouse
      - ./checkpoints:/checkpoints
      - ./spark:/opt/spark/app
      - ./scripts:/opt/spark/scripts:ro
      - ./tests:/opt/spark/tests:ro
      - ./.ivy2:/root/.ivy2   # cache --packages jars across runs
    networks:
      - lakehouse-net
    tty: true
    stdin_open: true

  ###############################################################################
  # Producer — synthetic order events to Redpanda
  # Optional profile so `docker-compose up -d` does not start it automatically.
  # Run with: docker-compose --profile producer up -d producer
  ###############################################################################
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
    depends_on:
      redpanda:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    environment:
      - BOOTSTRAP_SERVERS=redpanda:9092
      - TOPIC=order-events
      - RATE=50
      - DUP_RATIO=0.10
      - LATE_RATIO=0.10
      - DURATION=0
      - SEED=42
    volumes:
      - ./producer:/app
    networks:
      - lakehouse-net
    profiles:
      - producer

networks:
  lakehouse-net:
    driver: bridge

volumes:
  redpanda-data:
