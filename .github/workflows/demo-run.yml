name: Cloud demo run

# Free, on-demand execution of the whole pipeline on GitHub's cloud runners.
# Trigger it from the "Actions" tab (Run workflow) or the button on the
# showcase page (docs/index.html), which deep-links to this workflow.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Producer duration (seconds)"
        required: false
        default: "60"
      rate:
        description: "Events per second"
        required: false
        default: "50"
      seed:
        description: "Random seed"
        required: false
        default: "42"
      stream_seconds:
        description: "Safety backstop: hard max seconds the streaming job may run"
        required: false
        default: "600"
      idle_seconds:
        description: "Stop once no new rows arrive for this long (full drain)"
        required: false
        default: "45"

# One demo at a time; queue rather than cancel so runs are reproducible.
concurrency:
  group: cloud-demo
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  demo:
    name: Redpanda -> Spark -> Delta (Bronze/Silver/Gold)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DURATION: ${{ github.event.inputs.duration }}
      RATE: ${{ github.event.inputs.rate }}
      SEED: ${{ github.event.inputs.seed }}
      STREAM_SECONDS: ${{ github.event.inputs.stream_seconds }}
      IDLE_SECONDS: ${{ github.event.inputs.idle_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner and Docker info
        run: |
          docker version
          docker compose version

      - name: Cache Spark package jars (.ivy2)
        uses: actions/cache@v4
        with:
          path: .ivy2
          key: ivy2-${{ runner.os }}-spark3.5.3-delta3.2.0

      - name: Build Spark and producer images
        run: docker compose --profile producer build spark producer

      - name: Start Redpanda (wait until healthy)
        run: docker compose up -d --wait redpanda

      - name: Create topic order-events (idempotent)
        run: docker compose run --rm -T --no-deps topic-init

      - name: Start streaming ingestion (detached, bounded)
        run: |
          docker compose run -d -T --no-deps --name p2-ingest \
            -e STREAM_IDLE_TIMEOUT_SECONDS="${IDLE_SECONDS}" \
            -e STREAM_MAX_SECONDS="${STREAM_SECONDS}" \
            spark spark-submit \
            --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/app/stream_ingestion.py

      - name: Produce synthetic order events
        run: |
          docker compose --profile producer run --rm -T --no-deps producer \
            python event_producer.py \
            --duration "${DURATION}" --rate "${RATE}" --seed "${SEED}"

      - name: Wait for ingestion to drain and stop
        run: |
          for _ in $(seq 1 200); do
            state=$(docker inspect -f '{{.State.Running}}' p2-ingest 2>/dev/null || echo gone)
            [ "$state" = "false" ] && break
            [ "$state" = "gone" ] && break
            sleep 5
          done
          echo "--- ingestion log (tail) ---"
          docker logs p2-ingest 2>&1 | tail -50 || true
          code=$(docker inspect -f '{{.State.ExitCode}}' p2-ingest 2>/dev/null || echo 1)
          echo "ingestion exit code: $code"
          [ "$code" = "0" ] || { echo "Ingestion did not exit cleanly"; exit 1; }

      - name: Build Gold + compact (OPTIMIZE / ZORDER)
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps spark spark-submit \
            --packages io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/app/gold_compaction.py 2>&1 | tee gold_run.txt

      - name: Verify Silver (dedup)
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps spark spark-submit \
            --packages io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/tests/verify_silver_dedup.py 2>&1 | tee verify_silver_dedup.txt

      - name: Verify Bronze (contiguous offsets)
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps spark spark-submit \
            --packages io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/tests/verify_bronze_offsets.py 2>&1 | tee verify_bronze_offsets.txt

      - name: Verify Gold (independent recompute)
        run: |
          set -o pipefail
          docker compose run --rm -T --no-deps spark spark-submit \
            --packages io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/tests/verify_gold.py 2>&1 | tee verify_gold.txt

      - name: Generate dashboard metrics (read-only)
        run: |
          set -o pipefail
          # --metrics-only reads the compacted Gold table; it must not rewrite
          # Gold, otherwise it would undo OPTIMIZE/ZORDER from the step above.
          docker compose run --rm -T --no-deps spark spark-submit \
            --packages io.delta:delta-spark_2.12:3.2.0 \
            /opt/spark/app/gold_refresh.py --once --metrics-only \
            2>&1 | tee dashboard_refresh.txt

      - name: Build and verify dashboard API
        run: |
          set -o pipefail
          docker compose --profile dashboard build dashboard
          docker compose --profile dashboard up -d dashboard
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8501/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8501/healthz | tee dashboard_health.json
          curl -sf http://127.0.0.1:8501/api/metrics > dashboard_metrics.json
          # Contract + accounting identity (no hardcoded canonical counts, so
          # workflow inputs stay configurable).
          python3 tests/verify_dashboard_metrics.py dashboard_metrics.json \
            2>&1 | tee verify_dashboard_metrics.txt

      - name: Publish summary
        if: always()
        run: |
          {
            echo "## Cloud demo run results"
            echo ""
            echo "Inputs: duration=\`${DURATION}s\` rate=\`${RATE}/s\` seed=\`${SEED}\` idle_stop=\`${IDLE_SECONDS}s\` backstop=\`${STREAM_SECONDS}s\`"
            echo ""
            for f in verify_silver_dedup.txt verify_bronze_offsets.txt verify_gold.txt; do
              if [ -f "$f" ]; then
                echo "### $f"
                echo '```'
                grep -E 'Silver rows|Distinct|bad total_amount|PASS|FAIL|FAIL|partition|Bronze|gold|Gold|revenue|order_count|mismatch|independent' "$f" | tail -20 || tail -20 "$f"
                echo '```'
              fi
            done
            if [ -f dashboard_refresh.txt ]; then
              echo "### Dashboard metrics refresh"
              echo '```'
              grep -E 'Mode:|REFRESH|One-shot|ERROR' dashboard_refresh.txt | tail -10 || tail -10 dashboard_refresh.txt
              echo '```'
            fi
            if [ -f verify_dashboard_metrics.txt ]; then
              echo "### Dashboard contract + KPIs"
              echo '```'
              cat verify_dashboard_metrics.txt
              echo '```'
            fi
            if [ -f gold_run.txt ]; then
              echo "### gold_run.txt (OPTIMIZE highlights)"
              echo '```'
              grep -E 'Gold aggregate rows|OPTIMIZE RESULT|Wrote Gold' gold_run.txt | tail -20 || echo "(no matching lines)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence
          path: |
            gold_run.txt
            verify_*.txt
            dashboard_refresh.txt
            dashboard_metrics.json
            dashboard_health.json
          if-no-files-found: warn

      - name: Tear down stack
        if: always()
        run: docker compose --profile producer --profile dashboard down -v --remove-orphans || true
